<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

        :root {
            --bg: #15131c;
            --surface: #1e1b29;
            --surface-2: #262236;
            --border: #322d42;
            --text: #f2eee6;
            --text-muted: #9891ac;
            --accent: #e9a23b;
            --accent-soft: rgba(233, 162, 59, 0.16);
            --accent-ring: rgba(233, 162, 59, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        body {
            width: 380px;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px 8px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 0 var(--accent-ring);
            animation: pulse 2.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 var(--accent-ring);
            }

            70% {
                box-shadow: 0 0 0 6px rgba(233, 162, 59, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(233, 162, 59, 0);
            }
        }

        .wordmark {
            font-family: 'Fraunces', serif;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .settings-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 15px;
            padding: 4px;
            line-height: 1;
            transition: color 0.15s ease;
        }

        .settings-btn:hover {
            color: var(--text);
        }

        .tagline {
            margin: 0 18px 14px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .search-wrap {
            margin: 0 18px 6px;
            position: relative;
        }

        #query {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 14px;
            font-family: 'Inter', sans-serif;
            font-size: 13.5px;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        #query::placeholder {
            color: var(--text-muted);
        }

        #query:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        #status {
            margin: 8px 18px 0;
            font-size: 11.5px;
            color: var(--text-muted);
            font-family: 'IBM Plex Mono', monospace;
            min-height: 14px;
        }

        #results {
            margin-top: 6px;
            padding: 0 18px 14px;
            max-height: 340px;
            overflow-y: auto;
        }

        .result {
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .result:last-child {
            border-bottom: none;
        }

        .result-title {
            font-family: 'Fraunces', serif;
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            text-decoration: none;
            display: block;
            margin-bottom: 3px;
        }

        .result-title:hover {
            color: var(--accent);
        }

        .result-meta {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10.5px;
            color: var(--accent);
            letter-spacing: 0.02em;
            text-transform: lowercase;
        }

        .result-snippet {
            font-size: 12px;
            line-height: 1.5;
            color: var(--text-muted);
            margin: 5px 0 0;
        }

        .empty-state {
            padding: 28px 4px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 12.5px;
            line-height: 1.6;
        }

        footer {
            padding: 8px 18px 14px;
            text-align: right;
        }

        footer a {
            font-size: 10.5px;
            color: var(--text-muted);
            text-decoration: none;
            font-family: 'IBM Plex Mono', monospace;
        }

        footer a:hover {
            color: var(--accent);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--surface-2);
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="brand">
            <span class="dot"></span>
            <span class="wordmark">RecallIQ</span>
        </div>
        <button class="settings-btn" id="openOptions" title="Settings">⚙</button>
    </div>
    <p class="tagline">Your browsing, remembered.</p>

    <div class="search-wrap">
        <input id="query" placeholder="Ask what you remember reading…" autocomplete="off" />
    </div>
    <div id="status"></div>
    <div id="results">
        <div class="empty-state" id="emptyState">
            Type a phrase, a topic, or roughly what it was about —<br />exact words aren't necessary.
        </div>
    </div>

    <footer><a id="feedbackLink" href="#">v0.1 MVP</a></footer>
    <script src="popup.js"></script>
</body>

</html>
